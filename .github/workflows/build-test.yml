name: Build Test

on:
  workflow_dispatch:

concurrency:
  group: unity-license        # Personal license = only one Unity job at a time
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        targetPlatform: [Android, iOS]
    steps:
      # 1. Download the project
      - uses: actions/checkout@v5
        with:
          lfs: true

      # 2. Restore Library cache (makes builds much faster)
      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      # 3. Build with Unity (license is activated automatically)
      - uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.EMAIL }}
          UNITY_PASSWORD: ${{ secrets.PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

      # 4. Save the result
      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  # 5. iOS only: check the Xcode project really compiles (needs a Mac)
  ios-compile:
    name: Compile iOS on Mac
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: build-iOS
          path: ios-build
      - name: Compile without signing
        run: |
          PROJECT=$(find ios-build -name "Unity-iPhone.xcodeproj" | head -n 1)
          xcodebuild -project "$PROJECT" -scheme Unity-iPhone \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
